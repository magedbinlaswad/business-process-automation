<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc"><title id="title">Business Process Automation architecture</title><desc id="desc">Private request passes access controls, template selection and validation, then creates and delivers PDFs with successful-path cleanup. A separate owner branch manages access.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#5b718f" stroke-width="1.4"/></marker></defs><rect width="1200" height="470" rx="20" fill="#0d1b2f"/><text x="48" y="58" fill="#fff" font-family="Arial,sans-serif" font-size="28" font-weight="700">Business Process Automation</text><text x="48" y="89" fill="#a6b8d0" font-family="Arial,sans-serif" font-size="17">Reusable document operations • n8n + JavaScript + Google Workspace</text><rect x="48" y="145" width="240" height="76" rx="12" fill="#182d46" stroke="#2c4766"/><text x="66" y="174" fill="#67dcc5" font-family="Arial,sans-serif" font-size="15" font-weight="700">01  PRIVATE REQUEST</text><text x="66" y="199" fill="#e0e8f4" font-family="Arial,sans-serif" font-size="14">Normalize user and input</text><rect x="340" y="145" width="240" height="76" rx="12" fill="#182d46" stroke="#2c4766"/><text x="358" y="174" fill="#67dcc5" font-family="Arial,sans-serif" font-size="15" font-weight="700">02  ACCESS CONTROL</text><text x="358" y="199" fill="#e0e8f4" font-family="Arial,sans-serif" font-size="14">Approve or deny access</text><rect x="632" y="145" width="240" height="76" rx="12" fill="#182d46" stroke="#2c4766"/><text x="650" y="174" fill="#67dcc5" font-family="Arial,sans-serif" font-size="15" font-weight="700">03  TEMPLATE + DATA</text><text x="650" y="199" fill="#e0e8f4" font-family="Arial,sans-serif" font-size="14">Select and validate batch</text><rect x="632" y="303" width="240" height="76" rx="12" fill="#182d46" stroke="#2c4766"/><text x="650" y="332" fill="#67dcc5" font-family="Arial,sans-serif" font-size="15" font-weight="700">04  GENERATE PDF</text><text x="650" y="357" fill="#e0e8f4" font-family="Arial,sans-serif" font-size="14">Copy, fill, link and export</text><rect x="340" y="303" width="240" height="76" rx="12" fill="#182d46" stroke="#2c4766"/><text x="358" y="332" fill="#67dcc5" font-family="Arial,sans-serif" font-size="15" font-weight="700">05  DELIVER + CLEAN</text><text x="358" y="357" fill="#e0e8f4" font-family="Arial,sans-serif" font-size="14">Send PDF, delete copy</text><rect x="48" y="303" width="240" height="76" rx="12" fill="#182d46" stroke="#2c4766"/><text x="66" y="332" fill="#67dcc5" font-family="Arial,sans-serif" font-size="15" font-weight="700">OWNER CONTROLS</text><text x="66" y="357" fill="#e0e8f4" font-family="Arial,sans-serif" font-size="14">Review requests and users</text><path d="M288 183 H330" fill="none" stroke="#5b718f" stroke-width="2" marker-end="url(#a)"/><path d="M580 183 H622" fill="none" stroke="#5b718f" stroke-width="2" marker-end="url(#a)"/><path d="M752 221 V293" fill="none" stroke="#5b718f" stroke-width="2" marker-end="url(#a)"/><path d="M632 341 H590" fill="none" stroke="#5b718f" stroke-width="2" marker-end="url(#a)"/><path d="M460 221 V260 H168 V293" fill="none" stroke="#5b718f" stroke-width="2" marker-end="url(#a)"/><text x="922" y="174" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700">1–20 records</text><text x="922" y="202" fill="#a6b8d0" font-family="Arial,sans-serif" font-size="15">per request</text><text x="922" y="262" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700">2 templates</text><text x="922" y="290" fill="#a6b8d0" font-family="Arial,sans-serif" font-size="15">ready to customize</text><text x="48" y="431" fill="#a6b8d0" font-family="Arial,sans-serif" font-size="14">Public template • Synthetic examples • Private configuration required • Cleanup follows successful delivery</text></svg>